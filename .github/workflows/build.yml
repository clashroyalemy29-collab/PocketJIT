
name: Build PocketJIT

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout PocketJIT
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build StikJIT framework
        run: |
          git clone --depth 1 https://github.com/StikDebug/StikJIT.git /tmp/StikJIT
          cd /tmp/StikJIT
          xcodegen generate
          xcodebuild archive \
            -scheme StikJIT \
            -destination 'generic/platform=iOS' \
            -archivePath build/StikJIT.xcarchive \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild -create-xcframework \
            -framework build/StikJIT.xcarchive/Products/Library/Frameworks/StikJIT.framework \
            -output StikJIT.xcframework

      - name: Add StikJIT to PocketJIT
        run: |
          mkdir -p Vendor
          cp -R /tmp/StikJIT/StikJIT.xcframework Vendor/

      - name: Generate PocketJIT project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project PocketJIT.xcodeproj \
            -scheme PocketJIT \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/PocketJIT.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload PocketJIT-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketJIT-unsigned-IPA
          path: PocketJIT-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
