name: PocketJIT
options:
  bundleIdPrefix: com.pocketjit
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"

packages: {}

targets:
  PocketJIT:
    type: application
    platform: iOS
    sources:
      - path: Sources/PocketJIT
      - path: Sources/Shared
    resources:
      - path: Resources
    info:
      path: Sources/PocketJIT/Info.plist
      properties:
        CFBundleDisplayName: PocketJIT
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Sources/PocketJIT/PocketJIT.entitlements
      properties:
        get-task-allow: true
    dependencies:
      - target: PocketJITHelper
        embed: true
      - framework: Vendor/StikJIT.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketjit.app
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor"

  PocketJITHelper:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/PocketJITHelper
      - path: Sources/Shared
    info:
      path: Sources/PocketJITHelper/Info.plist
      properties:
        CFBundleDisplayName: PocketJIT Helper
        NSExtension:
          NSExtensionPointIdentifier: com.apple.generic-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).HelperExtension
    entitlements:
      path: Sources/PocketJITHelper/PocketJITHelper.entitlements
      properties:
        get-task-allow: true
    dependencies:
      - framework: Vendor/StikJIT.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketjit.app.helper
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor"
        SKIP_INSTALL: YES

schemes:
  PocketJIT:
    build:
      targets:
        PocketJIT: all
    run:
      config: Debug
